<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SOC Lab — Live Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#0B0E11;
    --panel:#12161B;
    --panel-2:#181D24;
    --border:#22282F;
    --text:#E6E8EB;
    --muted:#7A8590;
    --ok:#3DD68C;
    --warn:#F5A623;
    --crit:#E5484D;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-title{
    font-family:var(--mono);
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
  }
  .brand-sub{
    color:var(--muted);
    font-size:12px;
    font-family:var(--mono);
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
  }
  .pulse{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 rgba(61,214,140,0.5);
    animation:pulse 2s infinite;
  }
  .pulse.down{ background:var(--crit); animation:pulseDown 1s infinite; }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,214,140,0.4);}
    70%{box-shadow:0 0 0 6px rgba(61,214,140,0);}
    100%{box-shadow:0 0 0 0 rgba(61,214,140,0);}
  }
  @keyframes pulseDown{
    0%{box-shadow:0 0 0 0 rgba(229,72,77,0.5);}
    70%{box-shadow:0 0 0 6px rgba(229,72,77,0);}
    100%{box-shadow:0 0 0 0 rgba(229,72,77,0);}
  }
  .container{ padding:24px 28px; }
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
  }
  .stat-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  .stat-value{
    font-family:var(--mono);
    font-size:28px;
    font-weight:700;
  }
  .stat-value.crit{ color:var(--crit); }
  .stat-value.warn{ color:var(--warn); }
  .stat-value.ok{ color:var(--ok); }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .panel-header{
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left;
    padding:10px 18px;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    border-bottom:1px solid var(--border);
    font-weight:500;
  }
  td{
    padding:10px 18px;
    font-size:13px;
    border-bottom:1px solid var(--border);
  }
  tr:last-child td{ border-bottom:none; }
  .time-cell{ font-family:var(--mono); color:var(--muted); white-space:nowrap; }
  .level-badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:4px;
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
  }
  .level-badge.crit{ background:rgba(229,72,77,0.15); color:var(--crit); }
  .level-badge.warn{ background:rgba(245,166,35,0.15); color:var(--warn); }
  .level-badge.ok{ background:rgba(61,214,140,0.15); color:var(--ok); }
  .empty{
    padding:40px;
    text-align:center;
    color:var(--muted);
    font-family:var(--mono);
    font-size:13px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function levelClass(level) {
  if (level >= 10) return 'crit';
  if (level >= 6) return 'warn';
  return 'ok';
}

function App() {
  const [alerts, setAlerts] = useState([]);
  const [connected, setConnected] = useState(true);
  const [error, setError] = useState(null);

  const fetchAlerts = () => {
    fetch('/api/alerts')
      .then(r => r.json())
      .then(data => {
        if (data.error) { setConnected(false); setError(data.error); return; }
        const hits = (data.hits && data.hits.hits) || [];
        setAlerts(hits.map(h => h._source));
        setConnected(true);
        setError(null);
      })
      .catch(err => { setConnected(false); setError(err.message); });
  };

  useEffect(() => {
    fetchAlerts();
    const interval = setInterval(fetchAlerts, 5000);
    return () => clearInterval(interval);
  }, []);

  const critCount = alerts.filter(a => a.rule && a.rule.level >= 10).length;
  const warnCount = alerts.filter(a => a.rule && a.rule.level >= 6 && a.rule.level < 10).length;
  const agents = new Set(alerts.map(a => a.agent && a.agent.name)).size;
  const topRule = (() => {
    const counts = {};
    alerts.forEach(a => {
      if (a.rule && a.rule.description) counts[a.rule.description] = (counts[a.rule.description] || 0) + 1;
    });
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    return sorted.length ? sorted[0][0] : '—';
  })();

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <div>
            <div className="brand-title">SOC LAB / CONSOLE</div>
            <div className="brand-sub">home-soc-lite · vboxnet0</div>
          </div>
        </div>
        <div className="status">
          <span className={"pulse" + (connected ? "" : " down")}></span>
          {connected ? "LIVE · polling every 5s" : ("DISCONNECTED · " + (error || ""))}
        </div>
      </div>

      <div className="container">
        <div className="stats">
          <div className="stat-card">
            <div className="stat-label">Alerts (24h)</div>
            <div className="stat-value">{alerts.length}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Critical (level 10+)</div>
            <div className="stat-value crit">{critCount}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Warnings (level 6-9)</div>
            <div className="stat-value warn">{warnCount}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Agents reporting</div>
            <div className="stat-value ok">{agents}</div>
          </div>
        </div>

        <div className="panel">
          <div className="panel-header">Live alert stream — top rule: {topRule}</div>
          {alerts.length === 0 ? (
            <div className="empty">No alerts yet. Launch an attack from Kali to see events land here.</div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Agent</th>
                  <th>Rule</th>
                  <th>Level</th>
                </tr>
              </thead>
              <tbody>
                {alerts.slice(0, 50).map((a, i) => (
                  <tr key={i}>
                    <td className="time-cell">{a.timestamp ? new Date(a.timestamp).toLocaleTimeString() : '—'}</td>
                    <td>{a.agent ? a.agent.name : '—'}</td>
                    <td>{a.rule ? a.rule.description : '—'}</td>
                    <td>
                      <span className={"level-badge " + levelClass(a.rule ? a.rule.level : 0)}>
                        {a.rule ? a.rule.level : '—'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
