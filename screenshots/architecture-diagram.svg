<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Home SOC lab architecture</title>
<desc>Kali attacks Metasploitable and Ubuntu-Target running DVWA; the Wazuh agent on Ubuntu-Target ships logs to the Wazuh manager, which applies custom detection rules and active response, storing alerts in the indexer, surfaced via the Wazuh dashboard and a custom React console.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="520" fill="#ffffff"/>

<!-- Network label -->
<rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="#d3d1c7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="44" font-family="sans-serif" font-size="12" fill="#888780">Isolated host-only network - 192.168.56.0/24</text>

<!-- Kali -->
<rect x="50" y="200" width="140" height="70" rx="10" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="120" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#501313">Kali</text>
<text x="120" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#791F1F">.10 - attacker</text>

<!-- Metasploitable -->
<rect x="270" y="90" width="150" height="70" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="345" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Metasploitable2</text>
<text x="345" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">.20 - network target</text>

<!-- Ubuntu-Target -->
<rect x="270" y="290" width="170" height="90" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="355" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#042C53">Ubuntu-Target</text>
<text x="355" y="334" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">.40 - Wazuh agent</text>
<text x="355" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">+ DVWA (Docker)</text>

<!-- Wazuh Manager -->
<rect x="530" y="230" width="180" height="110" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="620" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Wazuh manager</text>
<text x="620" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">.30 - custom rules</text>
<text x="620" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">+ decoders</text>
<text x="620" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">+ active response</text>
<text x="620" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">+ indexer</text>

<!-- Wazuh Dashboard -->
<rect x="760" y="150" width="120" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="820" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Wazuh</text>
<text x="820" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">dashboard</text>

<!-- Custom Console -->
<rect x="760" y="340" width="120" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="820" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Custom React</text>
<text x="820" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">console</text>

<!-- Arrows: Kali attacks -->
<path d="M190 220 L268 135" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="205" y="170" font-family="sans-serif" font-size="10" fill="#888780">nmap / exploit</text>

<path d="M190 245 L268 320" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="295" font-family="sans-serif" font-size="10" fill="#888780">Hydra / SQLi</text>

<!-- Ubuntu-Target -> Wazuh manager -->
<path d="M440 320 L528 300" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="450" y="300" font-family="sans-serif" font-size="10" fill="#888780">agent logs</text>

<!-- Wazuh manager -> Dashboard -->
<path d="M700 250 L758 195" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Wazuh manager -> Console -->
<path d="M700 320 L758 370" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="710" y="365" font-family="sans-serif" font-size="10" fill="#888780">indexer API</text>

<!-- Active response back to target -->
<path d="M560 340 C480 420, 400 420, 340 382" fill="none" stroke="#a32d2d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<text x="400" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#A32D2D">active response - blocks attacker IP</text>

<!-- Legend -->
<text x="40" y="480" font-family="sans-serif" font-size="10" fill="#888780">Solid arrows = log/data flow. Dashed red = automated active response.</text>
</svg>
